<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SJL Yard Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #111827; color: #ffffff; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #374151; }
    .title { font-size: 18px; font-weight: bold; color: #60a5fa; }
    .subtitle { font-size: 11px; color: #9ca3af; }
    .zone-select { background: #1f2937; color: #facc15; border: 1px solid #4b5563; padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 14px; }
    .camera-container { position: relative; width: 100%; height: 260px; background: #000; border-radius: 12px; overflow: hidden; margin: 14px 0; border: 2px solid #3b82f6; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .reticle { position: absolute; inset: 20px; border: 2px dashed #facc15; border-radius: 8px; pointer-events: none; opacity: 0.75; display: flex; align-items: center; justify-content: center; }
    .reticle-label { background: rgba(0,0,0,0.7); color: #fef08a; font-size: 11px; padding: 4px 8px; border-radius: 4px; }
    .status-badge { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.85); color: #4ade80; font-family: monospace; font-size: 11px; padding: 3px 8px; border-radius: 4px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .btn { border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
    .btn-camera { background: #16a34a; color: #fff; }
    .btn-camera.active { background: #ca8a04; }
    .btn-export { background: #2563eb; color: #fff; }
    .card { background: #1f2937; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #374151; }
    .card-title { font-size: 14px; font-weight: 600; }
    .badge-count { color: #facc15; font-size: 18px; font-weight: bold; }
    .table-box { background: #1f2937; border-radius: 8px; padding: 8px; overflow-y: auto; max-height: 200px; border: 1px solid #374151; flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { color: #9ca3af; padding: 6px; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #374151; }
    td { padding: 8px 6px; border-bottom: 1px solid #2d3748; }
    .plate-text { color: #fef08a; font-weight: bold; font-size: 14px; }
    .zone-text { color: #93c5fd; font-weight: 600; }
    .btn-delete { background: none; border: none; color: #f87171; font-size: 14px; cursor: pointer; }
    .manual-add { display: flex; gap: 8px; margin-top: 10px; }
    .input-text { flex: 1; background: #111827; border: 1px solid #4b5563; border-radius: 6px; padding: 8px; color: #fff; font-size: 13px; text-transform: uppercase; }
    .btn-add { background: #4b5563; color: #fff; padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="title">🚛 SJL Yard Scanner</div>
      <div class="subtitle">Quick Park Situation Logger</div>
    </div>
    <div>
      <select id="zoneSelect" class="zone-select">
        <option value="TFZ">TFZ</option>
        <option value="CASA">CASA</option>
        <option value="TAC">TAC</option>
      </select>
    </div>
  </div>

  <div class="camera-container">
    <video id="cameraStream" autoplay playsinline muted></video>
    <div class="reticle">
      <span class="reticle-label">Frame Trailer Matricule</span>
    </div>
    <div id="statusBadge" class="status-badge">Ready • Tap Start</div>
  </div>

  <div class="controls">
    <button id="toggleBtn" onclick="toggleCamera()" class="btn btn-camera">📷 Start Camera</button>
    <button onclick="exportCSV()" class="btn btn-export">📥 Export (.CSV)</button>
  </div>

  <div class="card">
    <span class="card-title">Scanned Today:</span>
    <span id="counter" class="badge-count">0</span>
  </div>

  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Matricule</th>
          <th>Zone</th>
          <th>Time</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Logged rows appear here -->
      </tbody>
    </table>
  </div>

  <!-- Fast manual input if camera isn't needed -->
  <div class="manual-add">
    <input type="text" id="manualInput" class="input-text" placeholder="Or type matricule (e.g. R 8174 BDG)">
    <button onclick="addManual()" class="btn-add">+ Add</button>
  </div>

  <script>
    let stream = null;
    let isRunning = false;
    let list = JSON.parse(localStorage.getItem('sjl_scanned_list') || '[]');

    function renderList() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      list.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:#9ca3af;">${list.length - index}</td>
          <td class="plate-text">${item.matricule}</td>
          <td class="zone-text">${item.zone}</td>
          <td style="color:#9ca3af; font-size:11px;">${item.time}</td>
          <td style="text-align:right;"><button class="btn-delete" onclick="removeItem(${index})">✕</button></td>
        `;
        tbody.appendChild(tr);
      });
      document.getElementById('counter').innerText = list.length;
      localStorage.setItem('sjl_scanned_list', JSON.stringify(list));
    }

    async function toggleCamera() {
      const btn = document.getElementById('toggleBtn');
      const badge = document.getElementById('statusBadge');

      if (!isRunning) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
            audio: false
          });
          document.getElementById('cameraStream').srcObject = stream;
          isRunning = true;
          btn.innerText = "⏹ Stop Camera";
          btn.classList.add('active');
          badge.innerText = "Camera Active";
        } catch (err) {
          alert("Camera Error: " + err.message);
          badge.innerText = "Camera Denied";
        }
      } else {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('cameraStream').srcObject = null;
        isRunning = false;
        btn.innerText = "📷 Start Camera";
        btn.classList.remove('active');
        badge.innerText = "Stopped";
      }
    }

    function addTrailer(matricule) {
      matricule = matricule.trim().toUpperCase();
      if (!matricule) return;
      
      const zone = document.getElementById('zoneSelect').value;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Check if already in list
      const exists = list.some(t => t.matricule.replace(/\s+/g, '') === matricule.replace(/\s+/g, ''));
      if (exists) {
        alert("Trailers already logged: " + matricule);
        return;
      }

      list.unshift({ matricule, zone, time });
      renderList();
    }

    function addManual() {
      const input = document.getElementById('manualInput');
      addTrailer(input.value);
      input.value = '';
    }

    document.getElementById('manualInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') addManual();
    });

    function removeItem(index) {
      list.splice(index, 1);
      renderList();
    }

    function exportCSV() {
      if (list.length === 0) {
        alert("List is empty!");
        return;
      }
      const today = new Date().toISOString().split('T')[0];
      let csvContent = "data:text/csv;charset=utf-8,DATE;MATRICULE;LIEU;Dated'arriveePort;DateSORTIEPort;JOURRESTANTS\n";

      list.forEach(row => {
        csvContent += `${today};${row.matricule};${row.zone};;;\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `SP_${today}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    renderList();
  </script>
</body>
</html>
